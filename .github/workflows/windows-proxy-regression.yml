name: Windows proxy recovery regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/windows/**'
      - '.github/workflows/windows-proxy-regression.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: windows-proxy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proxy:
    name: Native proxy recovery (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      AGENTDOCK_PROXY_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build without changing network settings
        shell: pwsh
        run: |
          dotnet build desktop/windows/control-panel-network-tests/AgentDock.ControlPanel.NetworkTests.csproj -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native proxy switch and local API regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          git rev-parse HEAD | Set-Content dist/proxy-source.txt
          dotnet run --no-build --project desktop/windows/control-panel-network-tests/AgentDock.ControlPanel.NetworkTests.csproj -c Release -r win-x64 2>&1 | Tee-Object dist/proxy-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-proxy-regression-${{ github.run_id }}
          path: dist/
          retention-days: 7
          if-no-files-found: warn
