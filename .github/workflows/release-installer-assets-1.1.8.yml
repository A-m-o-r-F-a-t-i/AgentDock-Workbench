name: Commit installer-only release policy

on:
  push:
    branches: [fix/20260927-android-security-audit]
    paths: [.github/workflows/release-installer-assets-1.1.8.yml]

permissions:
  contents: write

concurrency:
  group: release-installer-policy-v1.1.8
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository_id == '1370391430' && github.event.deleted != true && github.event.forced != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: A-m-o-r-F-a-t-i/AgentDock-Workbench
      WORK_BRANCH: fix/20260927-android-security-audit
      EXPECTED_PARENT: 03489e2a249cc9430fc7f4d5d19345a2f3198b6c
      RELEASE_ID: '397692739'
      RELEASE_TAG: v1.1.8
      RELEASE_TARGET: 4bd778d4077bbe58cfe19e4abb777f660694377b
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate one-shot source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$WORK_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote="$(git ls-remote origin "refs/heads/$WORK_BRANCH" | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA"

      - name: Apply verified publication policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload=''
          Path('/tmp/release-source.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --check /tmp/release-source.patch
          git apply /tmp/release-source.patch
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo=os.environ['GH_REPO']; release_id=int(os.environ['RELEASE_ID'])
          release=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{repo}/releases/{release_id}'],text=True))
          assert release['id']==release_id
          assert release['tag_name']==os.environ['RELEASE_TAG']
          assert release['target_commitish']==os.environ['RELEASE_TARGET']
          assert release['prerelease'] is True and release['draft'] is False
          names={item['name'] for item in release['assets']}
          expected={
              'AgentDockSetup-amd64.exe','AgentDockSetup-arm64.exe','AgentDock-macos-universal.dmg',
              'agentdock-workbench_1.1.8_amd64.deb','agentdock-workbench_1.1.8_arm64.deb',
              'agentdock-workbench-1.1.8-1.x86_64.rpm','agentdock-workbench-1.1.8-1.aarch64.rpm',
              'AgentDock-Workbench-1.1.8-Android-test-signed.apk'}
          assert names==expected
          Path('docs/releases/v1.1.8.md').write_text(release['body'])
          PY
          gofmt -w tools/release/catalog.go tools/release/catalog_test.go
          git diff --check

      - name: Test publication policy
        shell: bash
        run: |
          set -euo pipefail
          go test ./tools/release -count=1
          python3 -B scripts/test/test-workbench-release.py
          python3 scripts/test/check-workbench-brand.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('release','scripts/release/publish-workbench.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          installers=module.public_installers('1.1.8')
          assert len(installers)==8
          assert all(not name.endswith(('.zip','.tar.gz','.sha256')) for name in installers)
          notes=Path('docs/releases/v1.1.8.md').read_text()
          assert 'AgentDockSetup-amd64.exe' in notes
          assert 'Release 附件只保留可以直接安装的文件' in notes
          PY

      - name: Commit and push policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AgentDock Workbench Agent'
          git config user.email 'agentdock-workbench@users.noreply.github.com'
          git add docs/releases/v1.1.8.md scripts/release/publish-workbench.py scripts/test/test-workbench-release.py tools/release/catalog.go tools/release/catalog_test.go
          git commit -m 'release: publish installers only'
          git push origin "HEAD:$WORK_BRANCH"
          echo "Committed $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
