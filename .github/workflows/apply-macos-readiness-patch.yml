name: Apply macOS readiness patch

on:
  push:
    branches:
      - fix/macos-core-readiness-20261021

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-core-readiness-20261021
      - name: Apply reviewed Swift patch
        run: |
          git apply --check .github/patches/macos-core-readiness.patch
          git apply .github/patches/macos-core-readiness.patch
      - name: Commit final source
        run: |
          rm .github/patches/macos-core-readiness.patch
          rm .github/workflows/apply-macos-readiness-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(macos): verify Core identity and port convergence"
          git push origin HEAD:fix/macos-core-readiness-20261021
