name: Windows frontend regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/windows/**'
      - '.github/workflows/windows-frontend-regression.yml'
      - 'scripts/test/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: windows-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Frontend (${{ matrix.rid }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Record immutable source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          git rev-parse HEAD | Set-Content dist/source-commit.txt
      - name: Build platform frontend
        shell: pwsh
        run: |
          dotnet publish desktop/windows/control-panel/AgentDock.ControlPanel.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o dist/${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pure C# regressions
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          dotnet run --project desktop/windows/control-panel-tests/AgentDock.ControlPanel.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native WPF layout and interaction regressions
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          dotnet run --project desktop/windows/control-panel-layout-tests/AgentDock.ControlPanel.LayoutTests.csproj -c Release -- "$env:GITHUB_WORKSPACE" "$env:GITHUB_WORKSPACE/dist/layout-validation" 2>&1 | Tee-Object dist/wpf-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native proxy recovery and local API regressions
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          AGENTDOCK_PROXY_ACCEPTANCE: '1'
        run: |
          dotnet build desktop/windows/control-panel-network-tests/AgentDock.ControlPanel.NetworkTests.csproj -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --no-build --project desktop/windows/control-panel-network-tests/AgentDock.ControlPanel.NetworkTests.csproj -c Release -r win-x64 2>&1 | Tee-Object dist/proxy-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-${{ matrix.rid }}-${{ github.run_id }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
