name: Apply macOS Workbench repair patches

on:
  push:
    branches:
      - fix/20261020-macos-workbench-contracts
    paths:
      - 'patches/macos-workbench-*.patch'
      - '.github/workflows/apply-macos-workbench-patches.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/20261020-macos-workbench-contracts
          fetch-depth: 0
      - name: Apply reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          patches=(
            patches/macos-workbench-1-startup-contracts.patch
            patches/macos-workbench-2-workbench-state.patch
            patches/macos-workbench-3-tests.patch
          )
          git apply --check "${patches[@]}"
          git apply "${patches[@]}"
          rm -f "${patches[@]}" .github/workflows/apply-macos-workbench-patches.yml
      - name: Run focused checks
        shell: bash
        run: |
          set -euo pipefail
          root=desktop/macos/AgentDockApp
          for file in \
            Sources/AppDelegate.swift \
            Sources/DesktopUpdateTransactionRecovery.swift \
            Sources/InstallerRunner.swift \
            Sources/WorkbenchAPIRoutes.swift \
            Sources/WorkbenchDetailViewController.swift \
            Sources/WorkbenchManagement.swift \
            Sources/WorkbenchManagementWindow.swift \
            Sources/WorkbenchModels.swift \
            Sources/WorkbenchViewModel.swift \
            Sources/WorkbenchWindowController.swift \
            RegressionTests/TransportTests.swift \
            Tests/WorkbenchModelTests.swift; do
            swiftc -frontend -parse "$root/$file"
          done
          swiftc -swift-version 5 -parse-as-library \
            "$root/Sources/Localization.swift" \
            "$root/Sources/WorkbenchJSON.swift" \
            "$root/Sources/WorkbenchModels.swift" \
            "$root/Tests/WorkbenchModelTests.swift" \
            -o "$RUNNER_TEMP/workbench-model-tests"
          "$RUNNER_TEMP/workbench-model-tests"
          git diff --check
      - name: Commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix macOS Workbench Core contract regressions'
          git push origin HEAD:fix/20261020-macos-workbench-contracts
