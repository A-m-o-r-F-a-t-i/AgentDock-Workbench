name: One-shot monitor v1.1.9 republish

on:
  push:
    branches:
      - ops/diagnose-open-prs-20261020

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    if: ${{ contains(github.event.head_commit.message, 'monitor republish') && !contains(github.event.head_commit.message, '[monitor-result]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_SHA: 6fff01f1a206db9e3b1e96492767a969da45839c
      TRIGGER_SHA: 975e091babaaaa02d1cfa30c15e4c84a51c91dd7
      OPS_BRANCH: ops/diagnose-open-prs-20261020
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/diagnose-open-prs-20261020
      - name: Read workflow states
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          repo="$GITHUB_REPOSITORY"
          one_shot="$(gh api "repos/$repo/actions/workflows/one-shot-republish-v1.1.9.yml/runs?event=push&branch=$OPS_BRANCH&per_page=20")"
          candidate="$(gh api "repos/$repo/actions/workflows/workbench-release.yml/runs?event=workflow_dispatch&branch=main&per_page=30")"
          publisher="$(gh api "repos/$repo/actions/workflows/workbench-publish-existing.yml/runs?event=workflow_dispatch&branch=main&per_page=30")"
          jq -n \
            --arg main_sha "$MAIN_SHA" \
            --arg trigger_sha "$TRIGGER_SHA" \
            --argjson one_shot "$one_shot" \
            --argjson candidate "$candidate" \
            --argjson publisher "$publisher" \
            '{
              checked_at: (now | todate),
              main_sha: $main_sha,
              trigger_sha: $trigger_sha,
              republish_run: ([ $one_shot.workflow_runs[] | select(.head_sha == $trigger_sha) ] | sort_by(.created_at) | last | {id,status,conclusion,created_at,updated_at,html_url,display_title}),
              candidate_run: ([ $candidate.workflow_runs[] | select(.head_sha == $main_sha) ] | sort_by(.created_at) | last | {id,status,conclusion,created_at,updated_at,html_url,display_title}),
              publisher_run: ([ $publisher.workflow_runs[] | select(.head_sha == $main_sha) ] | sort_by(.created_at) | last | {id,status,conclusion,created_at,updated_at,html_url,display_title})
            }' > ops/republish-v1.1.9-monitor.json
          cat ops/republish-v1.1.9-monitor.json
      - name: Commit monitor result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin "$OPS_BRANCH"
          git add ops/republish-v1.1.9-monitor.json
          git commit -m 'chore: record republish monitor [monitor-result]'
          git push origin HEAD:"$OPS_BRANCH"
