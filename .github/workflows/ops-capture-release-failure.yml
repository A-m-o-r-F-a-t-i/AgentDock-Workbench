name: Temporary AgentDock release failure capture

on:
  push:
    branches:
      - ops/republish-v1.1.9-c9094a0c-20261021
    paths:
      - .github/workflows/ops-capture-release-failure.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: github.repository_id == '1370391430'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UBUNTU_JOB: '119268022220'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Capture PR 186 Ubuntu failure log
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$UBUNTU_JOB/logs" \
            --output ops-pr186-ubuntu.log
          test -s ops-pr186-ubuntu.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops-pr186-ubuntu.log
          git commit -m 'chore: record PR 186 Ubuntu failure diagnostics'
          git push origin "HEAD:$GITHUB_REF_NAME"
