name: Temporary AgentDock release failure capture

on:
  push:
    branches:
      - ops/republish-v1.1.9-c9094a0c-20261021
    paths:
      - .github/workflows/ops-capture-release-failure.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: github.repository_id == '1370391430'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '39613408226'
      UBUNTU_JOB: '119268022220'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Capture PR 186 Ubuntu failure log
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --job "$UBUNTU_JOB" --log > ops-pr186-ubuntu.log
          test -s ops-pr186-ubuntu.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops-pr186-ubuntu.log
          git commit -m 'chore: record PR 186 Ubuntu failure diagnostics'
          git push origin "HEAD:$GITHUB_REF_NAME"
