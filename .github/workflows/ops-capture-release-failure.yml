name: Temporary AgentDock release failure capture

on:
  push:
    branches:
      - ops/republish-v1.1.9-c9094a0c-20261021
    paths:
      - .github/workflows/ops-capture-release-failure.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: github.repository_id == '1370391430'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '39591809575'
      DARWIN_AMD64_JOB: '119194535797'
      DARWIN_ARM64_JOB: '119194535841'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Capture completed macOS failure logs
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,url,headSha,jobs > ops-release-failure-jobs.json
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --job "$DARWIN_AMD64_JOB" --log > ops-release-darwin-amd64.log
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --job "$DARWIN_ARM64_JOB" --log > ops-release-darwin-arm64.log
          test -s ops-release-darwin-amd64.log
          test -s ops-release-darwin-arm64.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops-release-failure-jobs.json ops-release-darwin-amd64.log ops-release-darwin-arm64.log
          git commit -m 'chore: record macOS release failure diagnostics'
          git push origin "HEAD:$GITHUB_REF_NAME"
