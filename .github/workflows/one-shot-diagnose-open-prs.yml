name: One-shot diagnose PR 171

on:
  push:
    branches:
      - ops/diagnose-open-prs-20261020

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, 'diagnose PR 171') && !contains(github.event.head_commit.message, '[diagnostic-results]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      OPS_BRANCH: ops/diagnose-open-prs-20261020
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/diagnose-open-prs-20261020
      - name: Collect failed job logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics /tmp/pr171-logs
          out=diagnostics/pr-171-installer-failures.txt
          : > "$out"
          while IFS=$'\t' read -r job_id job_name; do
            raw="/tmp/pr171-logs/${job_id}.raw"
            log="/tmp/pr171-logs/${job_id}.log"
            http="$(curl -sS -L -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
              -o "$raw")"
            if python3 - "$raw" <<'PY'
          import sys, zipfile
          raise SystemExit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)
          PY
            then
              unzip -p "$raw" > "$log"
            else
              cp "$raw" "$log"
            fi
            python3 - "$job_id" "$job_name" "$http" "$log" "$out" <<'PY'
          import re, sys
          from pathlib import Path
          job_id, job_name, http, log_path, out_path = sys.argv[1:]
          lines = Path(log_path).read_text(errors='replace').splitlines()
          pattern = re.compile(r'(?i)(error|fail(?:ed|ure)?|fatal|panic|timed out|timeout|mismatch|missing|Process completed|##\[error\])')
          selected = set()
          for i, line in enumerate(lines):
              if pattern.search(line):
                  selected.update(range(max(0, i - 12), min(len(lines), i + 35)))
          excerpt = '\n'.join(lines[i] for i in sorted(selected)) if selected else '\n'.join(lines[-800:])
          if len(excerpt) > 160000:
              excerpt = excerpt[-160000:]
          with Path(out_path).open('a') as output:
              output.write(f'=== job {job_id}: {job_name}, log_http={http} ===\n')
              output.write(excerpt)
              output.write('\n\n')
          PY
          done <<'EOF'
          118602078043	Validate installer on Windows PowerShell 5.1
          118604844498	Windows Installer gate
          EOF
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/pr-171-installer-failures.txt
          git commit -m 'chore: record PR 171 installer failures [diagnostic-results]'
          git push origin HEAD:"$OPS_BRANCH"
