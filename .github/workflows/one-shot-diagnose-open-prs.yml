name: One-shot diagnose republish failure

on:
  push:
    branches:
      - ops/diagnose-open-prs-20261020

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, 'diagnose republish failure') && !contains(github.event.head_commit.message, '[diagnostic-results]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_JOB_ID: '118601241132'
      OPS_BRANCH: ops/diagnose-open-prs-20261020
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/diagnose-open-prs-20261020
      - name: Extract failure log without aborting evidence capture
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics
          raw=/tmp/republish-failure.raw
          log=/tmp/republish-failure.log
          out=diagnostics/republish-failure.txt
          status="$(curl -sS -L -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" \
            -o "$raw" || true)"
          printf 'job=%s\nhttp_status=%s\n' "$FAILED_JOB_ID" "$status" > "$out"
          if python3 - "$raw" <<'PY'
          import sys, zipfile
          raise SystemExit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)
          PY
          then
            unzip -p "$raw" > "$log" 2>> "$out" || true
          else
            cp "$raw" "$log" 2>> "$out" || true
          fi
          python3 - "$log" "$out" <<'PY'
          import re, sys
          from pathlib import Path
          source, destination = map(Path, sys.argv[1:])
          lines = source.read_text(errors='replace').splitlines() if source.exists() else []
          pattern = re.compile(r'(?i)(error|fail(?:ed|ure)?|fatal|timed out|mismatch|missing|conclusion=|candidate run=|publisher run=|MAIN_SHA|CANDIDATE_RUN_ID|PUBLISH_RUN_ID|Process completed)')
          selected = set()
          for index, line in enumerate(lines):
              if pattern.search(line):
                  selected.update(range(max(0, index - 10), min(len(lines), index + 25)))
          excerpt = '\n'.join(lines[index] for index in sorted(selected)) if selected else '\n'.join(lines[-600:])
          if len(excerpt) > 160000:
              excerpt = excerpt[-160000:]
          with destination.open('a') as output:
              output.write('\n--- extracted log ---\n')
              output.write(excerpt)
              output.write('\n')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/republish-failure.txt
          git commit -m 'chore: record republish failure [diagnostic-results]'
          git push origin HEAD:"$OPS_BRANCH"
