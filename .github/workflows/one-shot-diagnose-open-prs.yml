name: One-shot patch PR 164 request body tests

on:
  push:
    branches:
      - ops/diagnose-open-prs-20261020

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, 'patch PR164 request body stream') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/20261020-macos-workbench-contracts
      - name: Read streamed URL request bodies in transport fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('desktop/macos/AgentDockApp/RegressionTests/TransportTests.swift')
          text = path.read_text()
          marker = '''    private func answer(_ value: WorkbenchJSON, status: Int = 200, delay: Double = 0) throws -> (Int, String, Data, Double) {
        (status, "application/json", try value.encodedData(), delay)
    }
'''
          helper = marker + '''    private func requestBody(_ request: URLRequest) throws -> Data {
        if let body = request.httpBody { return body }
        guard let stream = request.httpBodyStream else {
            throw URLError(.cannotDecodeContentData)
        }
        stream.open()
        defer { stream.close() }
        let capacity = 4096
        let buffer = UnsafeMutablePointer<UInt8>.allocate(capacity: capacity)
        defer { buffer.deallocate() }
        var data = Data()
        while true {
            let count = stream.read(buffer, maxLength: capacity)
            if count < 0 { throw stream.streamError ?? URLError(.cannotDecodeContentData) }
            if count == 0 { break }
            data.append(buffer, count: count)
        }
        return data
    }
'''
          if text.count(marker) != 1:
              raise SystemExit('answer helper marker not found exactly once')
          text = text.replace(marker, helper)
          old = 'let body = try WorkbenchJSON.decode(try XCTUnwrap(request.httpBody))'
          if text.count(old) != 2:
              raise SystemExit(f'expected two direct httpBody decodes, found {text.count(old)}')
          text = text.replace(old, 'let body = try WorkbenchJSON.decode(try self.requestBody(request))')
          path.write_text(text)
          PY
          git diff --check
      - name: Commit focused fixture fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/macos/AgentDockApp/RegressionTests/TransportTests.swift
          git commit -m 'test(macos): read streamed plugin request bodies'
          git push origin HEAD:fix/20261020-macos-workbench-contracts
