name: One-shot diagnose republish monitor

on:
  push:
    branches:
      - ops/diagnose-open-prs-20261020

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, 'diagnose republish monitor') && !contains(github.event.head_commit.message, '[diagnostic-results]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      OPS_BRANCH: ops/diagnose-open-prs-20261020
      JOB_ID: '118657656035'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/diagnose-open-prs-20261020
      - name: Extract failed job log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          raw=/tmp/monitor.raw
          log=/tmp/monitor.log
          out=diagnostics/republish-monitor-failure.txt
          curl -sS -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o "$raw"
          if python3 - "$raw" <<'PY'
          import sys, zipfile
          raise SystemExit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)
          PY
          then
            unzip -p "$raw" > "$log"
          else
            cp "$raw" "$log"
          fi
          tail -n 500 "$log" > "$out"
          cat "$out"
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin "$OPS_BRANCH"
          git add diagnostics/republish-monitor-failure.txt
          git commit -m 'chore: record monitor failure [diagnostic-results]'
          git push origin HEAD:"$OPS_BRANCH"
