name: One-shot diagnose republish failure

on:
  push:
    branches:
      - ops/diagnose-open-prs-20261020

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, 'diagnose republish failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_JOB_ID: '118601241132'
      OPS_BRANCH: ops/diagnose-open-prs-20261020
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/diagnose-open-prs-20261020
      - name: Extract failure log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          raw=/tmp/republish-failure.raw
          log=/tmp/republish-failure.log
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" > "$raw"
          if python3 - "$raw" <<'PY'
          import sys, zipfile
          raise SystemExit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)
          PY
          then
            unzip -p "$raw" > "$log"
          else
            cp "$raw" "$log"
          fi
          python3 - "$log" diagnostics/republish-failure.txt <<'PY'
          import re, sys
          from pathlib import Path
          source, destination = map(Path, sys.argv[1:])
          lines = source.read_text(errors='replace').splitlines()
          pattern = re.compile(r'(?i)(error|fail(?:ed|ure)?|fatal|timed out|mismatch|missing|conclusion=|candidate run=|publisher run=|MAIN_SHA|CANDIDATE_RUN_ID|PUBLISH_RUN_ID)')
          selected = set()
          for index, line in enumerate(lines):
              if pattern.search(line):
                  selected.update(range(max(0, index - 8), min(len(lines), index + 20)))
          excerpt = '\n'.join(lines[index] for index in sorted(selected)) if selected else '\n'.join(lines[-500:])
          if len(excerpt) > 120000:
              excerpt = excerpt[-120000:]
          destination.write_text(excerpt + '\n')
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/republish-failure.txt
          git commit -m 'chore: record republish failure [diagnostic-results]'
          git push origin HEAD:"$OPS_BRANCH"
