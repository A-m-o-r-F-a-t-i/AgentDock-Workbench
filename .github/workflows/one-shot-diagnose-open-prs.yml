name: One-shot diagnose open PRs

on:
  push:
    branches:
      - ops/diagnose-open-prs-20261020

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic-results]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/diagnose-open-prs-20261020
      - name: Extract failed job evidence
        shell: bash
        run: |
          set -u
          rm -rf diagnostics
          mkdir -p diagnostics
          while IFS=: read -r pr job label; do
            raw="diagnostics/pr-${pr}-job-${job}.raw"
            log="diagnostics/pr-${pr}-job-${job}.log"
            excerpt="diagnostics/pr-${pr}-job-${job}.txt"
            status=0
            curl -sS -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${job}/logs" \
              -o "$raw" || status=$?
            {
              echo "pr=$pr"
              echo "job=$job"
              echo "label=$label"
              echo "curl_status=$status"
              file "$raw" 2>&1 || true
            } > "$excerpt"
            if python3 - "$raw" <<'PY'
          import sys, zipfile
          raise SystemExit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)
          PY
            then
              unzip -p "$raw" > "$log" 2>> "$excerpt" || true
            else
              cp "$raw" "$log" 2>> "$excerpt" || true
            fi
            python3 - "$log" "$excerpt" <<'PY'
          import re, sys
          from pathlib import Path
          log_path, excerpt_path = map(Path, sys.argv[1:])
          text = log_path.read_text(errors='replace') if log_path.exists() else ''
          lines = text.splitlines()
          pattern = re.compile(r'(?i)(^|[\s:])(fail(?:ed|ure)?|error|panic|fatal|undefined|not found|cannot|mismatch|timeout)([\s:]|$)')
          selected = set()
          for i, line in enumerate(lines):
              if pattern.search(line):
                  selected.update(range(max(0, i - 6), min(len(lines), i + 10)))
          body = '\n'.join(lines[i] for i in sorted(selected)) if selected else '\n'.join(lines[-300:])
          if len(body) > 60000:
              body = body[-60000:]
          with excerpt_path.open('a') as output:
              output.write('\n\n--- extracted log ---\n')
              output.write(body)
              output.write('\n')
          PY
          done <<'EOF'
          169:118585853052:Go check ubuntu after canonical native fix
          EOF
          rm -f diagnostics/*.raw diagnostics/*.log
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics
          git diff --cached --quiet && exit 0
          git commit -m 'chore: persist failed job logs [diagnostic-results]'
          git push origin HEAD:ops/diagnose-open-prs-20261020

