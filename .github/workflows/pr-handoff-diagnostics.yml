name: Targeted MCP Handoff Diagnostics
on:
  push:
    branches:
      - fix/host-tool-handoff-20261021
    paths-ignore:
      - pr-handoff-diagnostic-results.txt
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run affected Go packages
        id: tests
        shell: bash
        run: |
          set +e
          go test -p 2 ./internal/tool/mcp ./internal/app ./internal/mcp -count=1 -timeout=8m > mcp-diag.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save bounded failure identifiers on diagnostic branch
        if: steps.tests.outputs.exit_code != '0'
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          lines = open('mcp-diag.log', encoding='utf-8', errors='replace').read().splitlines()
          selected = []
          for line in lines:
              if re.match(r'^(FAIL|--- FAIL|# |panic:|fatal error:|[A-Za-z0-9_./-]+\.go:[0-9]+(?::[0-9]+)?:)', line):
                  selected.append(line[:350])
          with open('pr-handoff-diagnostic-results.txt', 'w', encoding='utf-8') as f:
              f.write('go test failed; selected package/test/compiler identifiers only\n')
              f.write('\n'.join(selected[:120]) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pr-handoff-diagnostic-results.txt
          git commit -m 'ci: store temporary sanitized MCP test diagnostics' || true
          git push origin HEAD:fix/host-tool-handoff-20261021
