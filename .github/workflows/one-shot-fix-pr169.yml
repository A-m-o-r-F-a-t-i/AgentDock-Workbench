name: One-shot fix PR 169

on:
  push:
    branches:
      - copilot/fix-160473846-1370391430-c8967934-1537-4c68-8e75-728d52bf63c6

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[one-shot-pr169]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: copilot/fix-160473846-1370391430-c8967934-1537-4c68-8e75-728d52bf63c6
      - name: Patch projection and release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dynamic = Path('internal/mcp/dynamic_model_response.go')
          text = dynamic.read_text()
          old = '''\tif hasNativeContent(envelope["content"]) {
\t\tresult = withoutForwardedNativeContent(result)
\t}
'''
          if text.count(old) != 1:
              raise SystemExit('dynamic native forwarding block not found exactly once')
          text = text.replace(old, '')
          start = text.index('func hasNativeContent(value any) bool {')
          end = text.index('func mcpModelContinuation(full map[string]any) map[string]any {')
          text = text[:start] + text[end:]
          dynamic.write_text(text)

          test = Path('internal/mcp/structured_result_test.go')
          text = test.read_text()
          old = '''\tif chars, err := modelEnvelopeChars(envelope); err != nil || chars != utf8.RuneCount(encoded) {
\t\tt.Fatalf("budget counted rounded data: chars=%d actual=%d err=%v", chars, utf8.RuneCount(encoded), err)
\t}
'''
          new = '''\tmeasuredEnvelope := asMap(withoutNativeAttachmentData(envelope))
\tmeasuredResult, err := sdkToolResult(measuredEnvelope)
\tif err != nil {
\t\tt.Fatal(err)
\t}
\tmeasuredEncoded, err := json.Marshal(measuredResult)
\tif err != nil {
\t\tt.Fatal(err)
\t}
\tif chars, err := modelEnvelopeChars(envelope); err != nil || chars != utf8.RuneCount(measuredEncoded) || chars >= utf8.RuneCount(encoded) {
\t\tt.Fatalf("budget did not preserve exact numbers while excluding native payload data: chars=%d measured=%d actual=%d err=%v", chars, utf8.RuneCount(measuredEncoded), utf8.RuneCount(encoded), err)
\t}
'''
          if text.count(old) != 1:
              raise SystemExit('structured result budget assertion not found exactly once')
          test.write_text(text.replace(old, new))

          notes = Path('docs/releases/v1.1.9.md')
          text = notes.read_text()
          old_sentence = '　　Core 对最终模型可见的 `CallToolResult` 使用统一字符预算，并在完整响应组装、JSON 转义和兼容摘要生成后校验。系统自动生成的文本兼容摘要保持简短；上游返回的非等价文本、图片、音频、资源及 `_meta` 保留在完整结果中。仅在能够证明文本 JSON 与 `structuredContent` 等价时去除重复副本。原生媒体同样计入最终预算，小型附件继续直接显示，超出范围时提供来源回执与后续读取入口。'
          new_sentence = '　　Core 对最终模型可见的 `CallToolResult` 使用统一字符预算，并在完整响应组装、JSON 转义和兼容摘要生成后校验。系统自动生成的文本兼容摘要保持简短；上游返回的非等价文本、图片、音频、资源及 `_meta` 保留在完整结果中。仅在能够证明文本 JSON 与 `structuredContent` 等价时去除重复副本。原生媒体使用独立的附件字节预算，不占用正文字符预算；预算内附件继续直接显示，超出范围时提供来源回执与后续读取入口。'
          if text.count(old_sentence) != 1:
              raise SystemExit('release media sentence not found exactly once')
          text = text.replace(old_sentence, new_sentence)
          old_table = '''| 平台 | 安装包 |
| --- | --- |
| Windows x64 | `AgentDock-Workbench-Setup-amd64.exe` |
| Windows ARM64 | `AgentDock-Workbench-Setup-arm64.exe` |
| macOS Intel / Apple Silicon | `AgentDock-macos-universal.dmg` |
| Debian / Ubuntu x64、ARM64 | 对应架构的 `.deb` |
| RPM 系 Linux x64、ARM64 | 对应架构的 `.rpm` |
| Android | `AgentDock-Workbench-1.1.9-Android.apk` |
'''
          new_table = '''| 平台 | 安装包 |
| --- | --- |
| Windows x64 | [下载 EXE](https://github.com/A-m-o-r-F-a-t-i/AgentDock-Workbench/releases/download/v1.1.9/AgentDock-Workbench-Setup-amd64.exe) |
| Windows ARM64 | [下载 EXE](https://github.com/A-m-o-r-F-a-t-i/AgentDock-Workbench/releases/download/v1.1.9/AgentDock-Workbench-Setup-arm64.exe) |
| macOS Intel / Apple Silicon | [下载 DMG](https://github.com/A-m-o-r-F-a-t-i/AgentDock-Workbench/releases/download/v1.1.9/AgentDock-macos-universal.dmg) |
| Debian / Ubuntu x64 | [下载 DEB](https://github.com/A-m-o-r-F-a-t-i/AgentDock-Workbench/releases/download/v1.1.9/agentdock-workbench_1.1.9_amd64.deb) |
| Debian / Ubuntu ARM64 | [下载 DEB](https://github.com/A-m-o-r-F-a-t-i/AgentDock-Workbench/releases/download/v1.1.9/agentdock-workbench_1.1.9_arm64.deb) |
| RPM 系 Linux x64 | [下载 RPM](https://github.com/A-m-o-r-F-a-t-i/AgentDock-Workbench/releases/download/v1.1.9/agentdock-workbench-1.1.9-1.x86_64.rpm) |
| RPM 系 Linux ARM64 | [下载 RPM](https://github.com/A-m-o-r-F-a-t-i/AgentDock-Workbench/releases/download/v1.1.9/agentdock-workbench-1.1.9-1.aarch64.rpm) |
| Android ARM64 | [下载 APK](https://github.com/A-m-o-r-F-a-t-i/AgentDock-Workbench/releases/download/v1.1.9/AgentDock-Workbench-1.1.9-Android.apk) |
'''
          if text.count(old_table) != 1:
              raise SystemExit('release installation table not found exactly once')
          notes.write_text(text.replace(old_table, new_table))
          PY
          gofmt -w internal/mcp/dynamic_model_response.go internal/mcp/structured_result_test.go
          rm .github/workflows/one-shot-fix-pr169.yml
      - name: Commit focused fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/mcp/dynamic_model_response.go internal/mcp/structured_result_test.go docs/releases/v1.1.9.md .github/workflows/one-shot-fix-pr169.yml
          git commit -m 'fix(mcp): preserve canonical native content [one-shot-pr169]'
          git push origin HEAD:copilot/fix-160473846-1370391430-c8967934-1537-4c68-8e75-728d52bf63c6
