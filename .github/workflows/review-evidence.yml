name: Requested merge review diagnostics
on:
  push:
    branches: [ci/20260929-review-evidence]
    paths: [.github/workflows/review-evidence.yml]
permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: write
  issues: write
jobs:
  evidence:
    if: github.repository_id == '1370391430' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const report = {run_id: context.runId, source_changed: false, jobs: []};
            for (const job_id of [109375028181, 109375028326, 108668983129, 109384073863]) {
              try {
                const job = (await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}', {owner,repo,job_id})).data;
                const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {owner,repo,job_id});
                const text = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString('utf8');
                const lines = text.split('\n'), selected = new Set();
                for (let i=0;i<lines.length;i++) {
                  if (/--- FAIL:|\bFAIL\s+github|panic:|fatal error:|Unformatted Go|\.go:\d+:\d+:|Traceback|RuntimeError|SyntaxError|Resource not accessible/.test(lines[i])) {
                    for (let j=Math.max(0,i-2);j<Math.min(lines.length,i+16);j++) selected.add(j);
                  }
                }
                let excerpt = selected.size ? [...selected].sort((a,b)=>a-b).map(i=>lines[i]).join('\n') : lines.slice(-50).join('\n');
                excerpt = excerpt.replace(/(bearer\s+)[A-Za-z0-9._~+\/-]+=*/ig,'$1[redacted]').slice(0,18000);
                report.jobs.push({job_id, name:job.name, conclusion:job.conclusion, url:job.html_url, failed_steps:job.steps.filter(s=>s.conclusion==='failure').map(s=>s.name), excerpt});
              } catch(error) {
                report.jobs.push({job_id,error:error.message});
                core.warning(`Evidence ${job_id}: ${error.message}`);
              }
            }
            const body='## Requested merge review — exact failure evidence\n\n```json\n'+JSON.stringify(report,null,2)+'\n```';
            await core.summary.addRaw(body).write();
            const branch='ci/20260929-review-evidence', path='diagnostics/review-evidence.json';
            let sha;
            try { sha=(await github.request('GET /repos/{owner}/{repo}/contents/{path}', {owner,repo,path,ref:branch})).data.sha; } catch(error) { if(error.status!==404) throw error; }
            await github.request('PUT /repos/{owner}/{repo}/contents/{path}', {owner,repo,path,branch,sha,message:'docs: retain sanitized requested review evidence',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')});
            try { await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/comments', {owner,repo,issue_number:25,body}); }
            catch(error) { core.warning(`Comment delivery failed; report persisted in ${branch}: ${error.message}`); }
