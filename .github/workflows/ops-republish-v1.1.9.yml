name: Republish stable AgentDock 1.1.9

on:
  push:
    branches:
      - ops/republish-v1.1.9-20261021
    paths:
      - .github/workflows/ops-republish-v1.1.9.yml
      - .github/operations/republish-v1.1.9-trigger.txt

permissions:
  actions: write
  contents: write

jobs:
  republish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 26c4a8b71a6dbeff7486c84f516c75828c8acf3b
      PRODUCT_VERSION: 1.1.9
    steps:
      - uses: actions/checkout@v5

      - name: Dispatch, monitor and verify stable replacement
        id: release
        continue-on-error: true
        shell: python
        run: |
          import datetime
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          api_root = os.environ['GITHUB_API_URL'].rstrip('/')
          source_sha = os.environ['SOURCE_SHA']
          version = os.environ['PRODUCT_VERSION']
          result_path = pathlib.Path('ops-results/republish-v1.1.9.json')
          result_path.parent.mkdir(parents=True, exist_ok=True)
          result = {
              'schema_version': 1,
              'source_sha': source_sha,
              'version': version,
              'state': 'running',
              'started_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  f'{api_root}/repos/{repo}/{path.lstrip("/")}',
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'agentdock-release-operator',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read()
                  return None if not raw else json.loads(raw)

          def dispatch(workflow, inputs):
              request('POST', f'actions/workflows/{workflow}/dispatches', {
                  'ref': 'main',
                  'inputs': inputs,
              })

          def parse_time(value):
              return datetime.datetime.fromisoformat(value.replace('Z', '+00:00'))

          def find_run(workflow, title, not_before, timeout_seconds=300):
              deadline = time.monotonic() + timeout_seconds
              encoded = urllib.parse.quote(workflow, safe='')
              while time.monotonic() < deadline:
                  response = request('GET', f'actions/workflows/{encoded}/runs?event=workflow_dispatch&branch=main&per_page=30')
                  matches = []
                  for run in response.get('workflow_runs', []):
                      if run.get('display_title') != title:
                          continue
                      if run.get('event') != 'workflow_dispatch' or run.get('head_branch') != 'main':
                          continue
                      if parse_time(run['created_at']) < not_before - datetime.timedelta(seconds=10):
                          continue
                      matches.append(run)
                  if matches:
                      return max(matches, key=lambda item: int(item['id']))
                  time.sleep(10)
              raise RuntimeError(f'Unable to locate dispatched workflow run: {workflow} / {title}')

          def wait_run(run_id, timeout_seconds):
              deadline = time.monotonic() + timeout_seconds
              while time.monotonic() < deadline:
                  run = request('GET', f'actions/runs/{run_id}')
                  if run.get('status') == 'completed':
                      return run
                  time.sleep(30)
              raise RuntimeError(f'Workflow run {run_id} did not finish within {timeout_seconds} seconds')

          def job_summary(run_id):
              response = request('GET', f'actions/runs/{run_id}/jobs?filter=latest&per_page=100')
              return [
                  {
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'html_url': job.get('html_url'),
                  }
                  for job in response.get('jobs', [])
              ]

          def resolve_tag_commit(tag):
              ref = request('GET', f'git/ref/tags/{tag}')
              obj = ref['object']
              seen = set()
              while obj['type'] == 'tag':
                  if obj['sha'] in seen:
                      raise RuntimeError('Tag object cycle detected')
                  seen.add(obj['sha'])
                  obj = request('GET', f'git/tags/{obj["sha"]}')['object']
              if obj['type'] != 'commit':
                  raise RuntimeError(f'Unexpected tag target type: {obj["type"]}')
              return obj['sha']

          try:
              main_sha = request('GET', 'git/ref/heads/main')['object']['sha']
              if main_sha != source_sha:
                  raise RuntimeError(f'Main changed before release dispatch: {main_sha} != {source_sha}')

              candidate_started = datetime.datetime.now(datetime.timezone.utc)
              candidate_title = f'AgentDock Workbench {source_sha}'
              dispatch('workbench-release.yml', {
                  'ref': source_sha,
                  'publish': 'false',
                  'prerelease': 'false',
                  'installation_tests': 'true',
                  'ignore_macos_intel_scale': 'false',
              })
              candidate = find_run('workbench-release.yml', candidate_title, candidate_started)
              result['candidate_run_id'] = candidate['id']
              result['candidate_run_url'] = candidate['html_url']
              candidate = wait_run(candidate['id'], 5400)
              result['candidate_conclusion'] = candidate.get('conclusion')
              if candidate.get('conclusion') != 'success':
                  result['candidate_jobs'] = job_summary(candidate['id'])
                  raise RuntimeError(f'Candidate workflow failed: {candidate["html_url"]}')

              publish_started = datetime.datetime.now(datetime.timezone.utc)
              publish_title = f'Publish verified Workbench {version} from run {candidate["id"]}'
              dispatch('workbench-publish-existing.yml', {
                  'run_id': str(candidate['id']),
                  'commit': source_sha,
                  'version': version,
                  'prerelease': 'false',
                  'replace_published': 'false',
                  'replace_stable': 'true',
              })
              publication = find_run('workbench-publish-existing.yml', publish_title, publish_started)
              result['publication_run_id'] = publication['id']
              result['publication_run_url'] = publication['html_url']
              publication = wait_run(publication['id'], 1800)
              result['publication_conclusion'] = publication.get('conclusion')
              if publication.get('conclusion') != 'success':
                  result['publication_jobs'] = job_summary(publication['id'])
                  raise RuntimeError(f'Publication workflow failed: {publication["html_url"]}')

              tag = f'v{version}'
              release = request('GET', f'releases/tags/{tag}')
              latest = request('GET', 'releases/latest')
              tag_commit = resolve_tag_commit(tag)
              if tag_commit != source_sha:
                  raise RuntimeError(f'{tag} points to {tag_commit}, expected {source_sha}')
              if release.get('draft') or release.get('prerelease'):
                  raise RuntimeError('Published stable release is draft or prerelease')
              if latest.get('tag_name') != tag:
                  raise RuntimeError(f'Latest release is {latest.get("tag_name")}, expected {tag}')

              required_names = [
                  f'AgentDock-Workbench-{version}-Setup-amd64.exe',
                  f'AgentDock-Workbench-{version}-Setup-arm64.exe',
                  f'AgentDock-Workbench-{version}-macos-universal.dmg',
                  f'agentdock-workbench_{version}_amd64.deb',
                  f'agentdock-workbench_{version}_arm64.deb',
                  f'agentdock-workbench-{version}-1.x86_64.rpm',
                  f'agentdock-workbench-{version}-1.aarch64.rpm',
                  f'AgentDock-Workbench-{version}-Android.apk',
              ]
              assets = {asset['name']: asset for asset in release.get('assets', [])}
              missing = [name for name in required_names if name not in assets]
              if missing:
                  raise RuntimeError(f'Release is missing required installers: {missing}')
              forbidden = {
                  'AgentDock-Workbench-Setup-amd64.exe',
                  'AgentDock-Workbench-Setup-arm64.exe',
                  'AgentDock-macos-universal.dmg',
              }
              present_forbidden = sorted(forbidden.intersection(assets))
              if present_forbidden:
                  raise RuntimeError(f'Legacy unversioned assets remain: {present_forbidden}')
              body = release.get('body') or ''
              for name in required_names:
                  url = assets[name]['browser_download_url']
                  if url not in body:
                      raise RuntimeError(f'Release body does not contain the direct link for {name}')
                  completed = subprocess.run(
                      ['curl', '--fail', '--location', '--head', '--silent', '--show-error', '--max-time', '60', url],
                      text=True,
                      capture_output=True,
                  )
                  if completed.returncode != 0:
                      raise RuntimeError(f'Direct installer link failed for {name}: {completed.stderr.strip()}')

              result.update({
                  'state': 'published',
                  'tag': tag,
                  'tag_commit': tag_commit,
                  'release_url': release.get('html_url'),
                  'published_at': release.get('published_at'),
                  'asset_count': len(assets),
                  'required_installers': required_names,
              })
          except Exception as exc:
              result['state'] = 'failed'
              result['error'] = str(exc)
          finally:
              result['completed_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              result_path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## AgentDock 1.1.9 replacement\n\n')
                  summary.write(f"State: **{result['state']}**\n\n")
                  if result.get('candidate_run_url'):
                      summary.write(f"Candidate: {result['candidate_run_url']}\n\n")
                  if result.get('publication_run_url'):
                      summary.write(f"Publication: {result['publication_run_url']}\n\n")
                  if result.get('release_url'):
                      summary.write(f"Release: {result['release_url']}\n\n")
                  if result.get('error'):
                      summary.write(f"Error: `{result['error']}`\n")
              if result['state'] != 'published':
                  sys.exit(1)

      - name: Retain release operation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops-results/republish-v1.1.9.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops-results/republish-v1.1.9.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(release): record v1.1.9 replacement result [skip ci]'
          git push

      - name: Fail when replacement did not publish
        if: steps.release.outcome != 'success'
        run: exit 1
