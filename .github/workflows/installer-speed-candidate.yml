name: Installer Speed Candidate

on:
  push:
    branches:
      - fix/20260927-installer-reliability-speed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # The reusable workflow contains a publish job with this declared permission.
    # release_build=true forces publish=false, including when called by a push.
    permissions:
      contents: write
    uses: ./.github/workflows/windows-package.yml
    with:
      ref: ${{ github.sha }}
      architectures: amd64,arm64
      release_build: true
      publish: false
      installation_tests: false
