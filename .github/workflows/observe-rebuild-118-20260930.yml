name: Observe existing 1.1.8 rebuild
on:
  push:
    branches: [ci/20260930-rebuild-118-request]
    paths: [.github/workflows/observe-rebuild-118-20260930.yml]
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: observe-rebuild-36656538592
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository_id == '1370391430' && !github.event.deleted && !github.event.forced
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: A-m-o-r-F-a-t-i/AgentDock-Workbench
    steps:
      - name: Observe original build without dispatching
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,os,pathlib,subprocess,time
          repo=os.environ['GH_REPO']; rid=36656538592; sha='24d04ef2a60e4b538b26051ee68c2554defface1'
          root=pathlib.Path('evidence')
          def api(path,*args):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path,*args],text=True,timeout=90))
          build=api('actions/runs/'+str(rid))
          assert build['head_sha']==sha and build['path']=='.github/workflows/workbench-release.yml' and build['event']=='workflow_dispatch'
          header='## 1.1.8 原构建跟踪\n\n固定源码：`'+sha+'`\n\n'+build['html_url']+'\n\n原生安装验收已启用，未豁免 macOS 性能门槛；本任务只观察，不重发构建、不修改 Release。\n\n'
          comment=api('issues/36/comments','--method','POST','-f','body='+header+'已恢复跟踪原构建。')
          last=None
          for _ in range(340):
              build=api('actions/runs/'+str(rid))
              jobs=api('actions/runs/'+str(rid)+'/jobs?per_page=100')
              assert jobs['total_count']<=100
              states=[(j['name'],j['status'],j['conclusion']) for j in jobs['jobs']]
              signature=(build['status'],build['conclusion'],states)
              (root/'build-run.json').write_text(json.dumps(build,indent=2))
              (root/'build-jobs.json').write_text(json.dumps(jobs,indent=2))
              if signature!=last:
                  body=header+'| Job | Status | Result |\n| --- | --- | --- |\n'+'\n'.join('| '+' | '.join(str(v or '—').replace('|','/') for v in row)+' |' for row in states)
                  body+='\n\n构建状态：'+build['status']+' / '+str(build['conclusion'])
                  api('issues/comments/'+str(comment['id']),'--method','PATCH','-f','body='+body)
                  last=signature
              if build['status']=='completed':
                  if build['conclusion']!='success':
                      p=subprocess.run(['gh','run','view',str(rid),'--repo',repo,'--log-failed'],capture_output=True,text=True,timeout=90)
                      (root/'failure.log').write_text(p.stdout+p.stderr)
                      api('issues/36/comments','--method','POST','-f','body=构建失败，旧 Release 未修改。\n```text\n'+(p.stdout+p.stderr)[-26000:]+'\n```')
                      raise RuntimeError('Build failed; fix source before publishing')
                  break
              time.sleep(20)
          else: raise RuntimeError('Observation time limit reached; original build not cancelled or replayed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-observation-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
